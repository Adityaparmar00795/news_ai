{% extends "base.html" %}

{% block content %}

<div class="max-w-md mx-auto mt-10">

<h2 class="text-xl font-semibold mb-4">Delete News</h2>

<p class="mb-6">Are you sure you want to delete this news?</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit" 
    class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
        Delete
    </button>

    <a href="{% url 'news_list' %}" 
    class="ml-3 text-gray-600">
        Cancel
    </a>

</form>

</div>

{% endblock %}
