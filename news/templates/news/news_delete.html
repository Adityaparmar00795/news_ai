{% extends "base.html" %}

{% block content %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap');

* { box-sizing: border-box; }

body {
    background: #f5f5f5;
    color: #111;
    font-family: 'Merriweather', serif;
}

.page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
}

.form-card {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border: 1px solid #ccc;
    border-top: 4px solid #111;
    padding: 36px 32px 40px;
}

.form-title {
    font-size: 26px;
    font-weight: 900;
    text-align: center;
    border-bottom: 1px solid #ccc;
    padding-bottom: 16px;
    margin-bottom: 24px;
    letter-spacing: -0.5px;
}

.warning-text {
    font-size: 14px;
    line-height: 1.7;
    color: #333;
    border-left: 3px solid #111;
    padding-left: 14px;
    margin-bottom: 28px;
}

.actions {
    display: flex;
    align-items: center;
    gap: 20px;
    border-top: 1px solid #ccc;
    padding-top: 24px;
}

button[type="submit"] {
    background: #111;
    color: #fff;
    border: none;
    padding: 11px 24px;
    font-family: 'Merriweather', serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
}

button[type="submit"]:hover {
    background: #8b0000;
}

.cancel-link {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #777;
    text-decoration: none;
    border-bottom: 1px solid #ccc;
    padding-bottom: 1px;
    transition: color 0.2s, border-color 0.2s;
}

.cancel-link:hover {
    color: #111;
    border-color: #111;
}
</style>

<div class="page">
    <div class="form-card">

        <h2 class="form-title">Delete News</h2>

        <p class="warning-text">Are you sure you want to delete this news? This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="actions">
                <button type="submit">Delete</button>
                <a href="{% url 'news_list' %}" class="cancel-link">Cancel</a>
            </div>
        </form>

    </div>
</div>

{% endblock %}
