{% extends "base.html" %}

{% block title %}Create News{% endblock %}

{% block content %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap');

* { box-sizing: border-box; }

body {
    background: #f5f5f5;
    color: #111;
    font-family: 'Merriweather', serif;
}

.page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
}

.form-card {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border: 1px solid #ccc;
    border-top: 4px solid #111;
    padding: 36px 32px 40px;
}

.form-title {
    font-size: 26px;
    font-weight: 900;
    text-align: center;
    border-bottom: 1px solid #ccc;
    padding-bottom: 16px;
    margin-bottom: 28px;
    letter-spacing: -0.5px;
}

.field {
    margin-bottom: 22px;
}

label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555;
    border-top: 2px solid #111;
    padding-top: 4px;
    margin-bottom: 10px;
}

textarea, input[type="file"] {
    width: 100%;
    background: #fafafa;
    border: 1px solid #ccc;
    color: #111;
    padding: 10px 12px;
    font-family: 'Merriweather', serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
}

textarea:focus, input[type="file"]:focus {
    border-color: #111;
}

textarea { rows: 4; resize: vertical; }

button[type="submit"] {
    width: 100%;
    background: #111;
    color: #fff;
    border: none;
    padding: 12px;
    font-family: 'Merriweather', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 6px;
}

button[type="submit"]:hover {
    background: #333;
}
</style>

<div class="page">
    <div class="form-card">

        <h2 class="form-title">Create News</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="field">
                <label>Text</label>
                <textarea name="text" rows="4"></textarea>
            </div>

            <div class="field">
                <label>Upload Image</label>
                <input type="file" name="photo">
            </div>

            <button type="submit">Save</button>
        </form>

    </div>
</div>

{% endblock %}
