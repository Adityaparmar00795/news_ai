<!-- AI Chatbot -->
<div class="fixed bottom-6 right-6 w-80 bg-gray-900 text-white rounded-xl shadow-lg">

    <div class="p-3 border-b border-gray-700 font-semibold">
        AI News Assistant
    </div>

    <div id="chat-box" class="p-3 h-60 overflow-y-auto text-sm space-y-2">
    </div>

    <div class="flex border-t border-gray-700">

        <input 
        id="chat-input"
        class="flex-1 bg-gray-900 p-2 outline-none text-sm"
        placeholder="Ask about this article...">

        <button onclick="sendMessage()" class="px-3 text-blue-400">
            Send
        </button>

    </div>

</div>


<script>

function summarizeArticle() {

    const urlParams = new URLSearchParams(window.location.search);
    const articleUrl = urlParams.get("url");

    fetch(`/summarize/?url=${articleUrl}`)
    .then(response => response.json())
    .then(data => {

        const box = document.getElementById("summary-box");

        box.innerHTML = "<strong>AI Summary:</strong><br>" + data.summary;

        box.classList.remove("hidden");

    });

}




function sendMessage() {

    const input = document.getElementById("chat-input")
    const chatBox = document.getElementById("chat-box")

    const question = input.value

    if (!question) return

    chatBox.innerHTML += `<div class="text-blue-400">You: ${question}</div>`

    const urlParams = new URLSearchParams(window.location.search)
    const articleUrl = urlParams.get("url")

    fetch(`/ask-ai/?url=${articleUrl}&question=${question}`)
    .then(res => res.json())
    .then(data => {

        chatBox.innerHTML += `<div class="text-green-400">AI: ${data.answer}</div>`

        chatBox.scrollTop = chatBox.scrollHeight

    })

    input.value = ""

}
</script>
