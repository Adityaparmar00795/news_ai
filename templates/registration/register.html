{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-white px-4">


<div class="w-full max-w-md border-2 border-black p-10">

    <h2 class="text-3xl font-bold text-center mb-8 tracking-wide">
        Create Account
    </h2>

    {% if form.errors %}
    <div class="border border-black p-3 mb-6 text-sm">
        {{ form.errors }}
    </div>
    {% endif %}

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block mb-2 text-sm uppercase tracking-wide">
                Email
            </label>
            {{ form.email }}
        </div>

        <div>
            <label class="block mb-2 text-sm uppercase tracking-wide">
                Password
            </label>
            {{ form.password1 }}
        </div>

        <div>
            <label class="block mb-2 text-sm uppercase tracking-wide">
                Confirm Password
            </label>
            {{ form.password2 }}
        </div>

        <button type="submit"
            class="w-full border border-black py-2 hover:bg-black hover:text-white transition">
            Register
        </button>

    </form>

    <p class="text-center text-sm mt-6">
        Already have an account?
        <a href="{% url "login" %}" class="underline">
            Login
        </a>
    </p>

</div>


</div>

{% endblock %}
